name: Dream Flip firmware build

on:
  push:
    branches:
      - dream-flip-dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dream-flip-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile firmware (no release)
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.5.4
      options: --user root
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Prepare ESP-IDF environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f /opt/esp/entrypoint.sh ]]; then
            source /opt/esp/entrypoint.sh >/dev/null || true
          fi
          if [[ -n "${IDF_PATH:-}" && -f "${IDF_PATH}/export.sh" ]]; then
            source "${IDF_PATH}/export.sh"
          fi
          # esp_mmap_assets imports qoi-conv.qoi, but its component archive can
          # leave the helper directory present without the importable module.
          MMAP_TOOL_DIR="managed_components/espressif__esp_mmap_assets/py_tool"
          mkdir -p "$MMAP_TOOL_DIR"
          rm -rf "$MMAP_TOOL_DIR/qoi-conv"
          git clone --depth 1 https://github.com/espressif2022/qoi_conv.git /tmp/qoi_conv
          cp -a /tmp/qoi_conv/qoi-conv "$MMAP_TOOL_DIR/qoi-conv"
          python3 -m pip install -r /tmp/qoi_conv/requirements.txt
          export PYTHONPATH="$PWD/$MMAP_TOOL_DIR${PYTHONPATH:+:$PYTHONPATH}"
          test -f "$MMAP_TOOL_DIR/qoi-conv/qoi.py"
          python3 -c "import importlib; importlib.import_module('qoi-conv.qoi'); print('qoi helper import OK')"
          python3 scripts/blank_cloudzao_endpoints.py
          python3 scripts/blank_cloudzao_endpoints.py --check
          chmod +x merge_firmware.sh
          ./merge_firmware.sh

      - name: Resolve firmware filename
        id: firmware
        shell: bash
        run: |
          set -euo pipefail
          VER="$(sed -n 's/^set(PROJECT_VER "\([^"]*\)").*/\1/p' CMakeLists.txt | head -1)"
          test -n "$VER"
          FILE="firmware/metalio-e-ink4-${VER}.bin"
          test -f "$FILE"
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          ls -lh "$FILE"

      - name: Upload flashable firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: dream-flip-firmware-${{ steps.firmware.outputs.version }}
          path: ${{ steps.firmware.outputs.path }}
          if-no-files-found: error
          retention-days: 14
